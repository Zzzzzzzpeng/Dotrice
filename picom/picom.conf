###############################################################
#                    PICOM ANIMATION LAB                     #
#                bspwm / X11 / GLX / v13                     #
#                                                             #
#       SMOOTH • SNAPPY • EXPERIMENTAL • DESKTOP MOTION       #
###############################################################


###############################################################
#                         BACKEND                            #
###############################################################

backend = "glx";

# Tear-free rendering.
vsync = true;

# Redraw damaged regions only.
use-damage = true;

# Dithering is unnecessary for this setup.
# Lower rendering overhead.
dithered-present = false;

# Keep compositor redirected even in fullscreen.
# More consistent behaviour for screenshots and effects.
unredir-if-possible = false;


###############################################################
#                    FRAME / PRESENTATION                     #
###############################################################

# On NVIDIA + GLX, this can help with synchronisation
# when applications draw faster than Picom.
#
# EXPERIMENT:
# Try true first.
#
xrender-sync-fence = true;


###############################################################
#                       DETECTION                            #
###############################################################

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;


###############################################################
#                         FADING                             #
###############################################################

# Keep normal Picom fading enabled as a fallback.
fading = true;

# Faster fade stepping.
fade-in-step = 0.10;
fade-out-step = 0.12;

# Small frame interval.
# Lower = potentially smoother, higher = lighter.
fade-delta = 4;


###############################################################
#                         SHADOWS                            #
###############################################################

shadow = true;

shadow-radius = 20;
shadow-opacity = 0.44;

shadow-offset-x = -6;
shadow-offset-y = 6;

shadow-color = "#000000";


###############################################################
#                     ROUNDED CORNERS                        #
###############################################################

corner-radius = 14;


###############################################################
#                       FRAME OPACITY                        #
###############################################################

frame-opacity = 1.0;


###############################################################
#                           BLUR                             #
###############################################################

blur: {
    method = "dual_kawase";

    # 0–20.
    #
    # 5 = fast
    # 6 = balanced
    # 7 = heavier
    #
    strength = 5;

    background = false;
    background-frame = false;
    background-fixed = false;
};


###############################################################
#                    GLOBAL WINDOW RULES                     #
###############################################################

rules = (


    ###########################################################
    #                     FOCUSED WINDOWS                    #
    ###########################################################

    {
        match = "focused || group_focused";

        opacity = 0.96;

        corner-radius = 12;

        shadow = true;

        blur-background = true;
        blur-opacity = 0.84;
    },


    ###########################################################
    #                    UNFOCUSED WINDOWS                   #
    ###########################################################

    {
        match = "!focused && !group_focused";

        opacity = 0.86;

        corner-radius = 12;

        shadow = true;

        blur-background = true;
        blur-opacity = 0.68;
    },


    ###########################################################
    #                       FULLSCREEN                        #
    ###########################################################

    {
        match = "fullscreen";

        opacity = 1.0;

        blur-background = false;
        blur-opacity = 1.0;

        corner-radius = 0;

        shadow = false;

        fade = false;
    },


    ###########################################################
    #                          KITTY                          #
    ###########################################################

    {
        match = "class_g = 'kitty'";

        opacity = 0.93;

        blur-background = true;
        blur-opacity = 0.5;

        corner-radius = 12;

        shadow = true;
    },


    ###########################################################
    #                         VIVALDI                         #
    ###########################################################

    {
        match = "class_g = 'Vivaldi-stable'";

        opacity = 0.93;

        blur-background = true;
        blur-opacity = 0.8;

        corner-radius = 12;

        shadow = true;
    },


    ###########################################################
    #                         SPOTIFY                         #
    ###########################################################

    {
        match = "class_g = 'spotify'";

        opacity = 0.93;

        blur-background = true;
        blur-opacity = 1.0;

        corner-radius = 12;

        shadow = true;
    },


    ###########################################################
    #                         VESKTOP                         #
    ###########################################################

    {
        match = "class_g = 'vesktop'";

        opacity = 0.93;

        blur-background = true;
        blur-opacity = 1.0;

        corner-radius = 12;

        shadow = true;
    },


    ###########################################################
    #                         WHATSIE                         #
    ###########################################################

    {
        match = "class_g = 'whatsie'";

        opacity = 0.93;

        blur-background = true;
        blur-opacity = 1.0;

        corner-radius = 12;

        shadow = true;
    },


    ###########################################################
    #                           MPV                           #
    ###########################################################

    {
        match = "class_g = 'mpv'";

        opacity = 1.0;

        blur-background = false;

        corner-radius = 12;

        shadow = false;

        fade = false;
    },


    ###########################################################
    #                 POPUPS / MENUS / TOOLTIPS              #
    ###########################################################

    {
        match =
            "window_type = 'popup_menu' ||
             window_type = 'dropdown_menu' ||
             window_type = 'menu' ||
             window_type = 'tooltip'";

        opacity = 1.0;

        blur-background = false;

        corner-radius = 8;

        shadow = true;
    },


    ###########################################################
    #                         POLYBAR                         #
    ###########################################################

    {
        match = "class_g = 'Polybar'";

        opacity = 0.97;

        blur-background = false;

        corner-radius = 0;

        shadow = false;

        fade = false;
    },


    ###########################################################
    #                          DUNST                          #
    ###########################################################

    {
        match = "class_g = 'Dunst'";

        opacity = 0.98;

        blur-background = false;

        corner-radius = 10;

        shadow = true;
    },


    ###########################################################
    #                 SCREENSHOT SELECTION                   #
    #
    # maim -s uses slop.
    #
    # IMPORTANT:
    # NO blur
    # NO shadow
    # NO fade
    # NO transparency
    #
    ###########################################################

    {
        match = "class_g = 'slop'";

        opacity = 1.0;

        blur-background = false;

        blur-opacity = 1.0;

        corner-radius = 0;

        shadow = false;

        fade = false;
    },


    ###########################################################
    #                    DESKTOP WINDOW                      #
    ###########################################################

    {
        match = "window_type = 'desktop'";

        opacity = 1.0;

        blur-background = false;

        corner-radius = 0;

        shadow = false;

        fade = false;
    }

);


###############################################################
#                     ANIMATION ENGINE                       #
###############################################################

animations = (


    ###########################################################
    #                  OPEN / CREATE WINDOW                  #
    #
    # Small scale + upward motion + fade.
    #
    # Result:
    # window appears to "settle" into bspwm.
    #
    ###########################################################

    {
        triggers = [ "open", "show" ];

        suppressions = [
            "close",
            "hide",
            "increase-opacity",
            "decrease-opacity"
        ];


        opacity = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";

            duration = 0.12;

            start = 0.0;
            end = 1.0;
        };


        blur-opacity = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";

            duration = 0.12;

            start = 0.0;
            end = 0.84;
        };


        scale-x = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";

            duration = 0.12;

            start = 0.965;
            end = 1.0;
        };


        scale-y = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";

            duration = 0.12;

            start = 0.965;
            end = 1.0;
        };


        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";


        offset-y = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";

            duration = 0.12;

            start = 8;
            end = 0;
        };


        shadow-offset-y = "offset-y";
    },


    ###########################################################
    #                    CLOSE / HIDE                        #
    #
    # Opposite of open.
    #
    ###########################################################

    {
        triggers = [ "close", "hide" ];

        suppressions = [
            "open",
            "show",
            "increase-opacity",
            "decrease-opacity"
        ];


        opacity = {
            curve = "cubic-bezier(0.7, 0, 0.84, 0)";

            duration = 0.085;

            start = 1.0;
            end = 0.0;
        };


        blur-opacity = {
            curve = "cubic-bezier(0.7, 0, 0.84, 0)";

            duration = 0.085;

            start = 0.84;
            end = 0.0;
        };


        scale-x = {
            curve = "cubic-bezier(0.7, 0, 0.84, 0)";

            duration = 0.085;

            start = 1.0;
            end = 0.965;
        };


        scale-y = {
            curve = "cubic-bezier(0.7, 0, 0.84, 0)";

            duration = 0.085;

            start = 1.0;
            end = 0.965;
        };


        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";


        offset-y = {
            curve = "cubic-bezier(0.7, 0, 0.84, 0)";

            duration = 0.085;

            start = 0;
            end = 6;
        };


        shadow-offset-y = "offset-y";


        shadow-opacity = {
            curve = "cubic-bezier(0.7, 0, 0.84, 0)";

            duration = 0.085;

            start = 0.44;
            end = 0.0;
        };
    },


    ###########################################################
    #                     FOCUS IN                           #
    #
    # When bspwm focuses a different window.
    #
    ###########################################################

    {
        triggers = [ "increase-opacity" ];

        suppressions = [
            "decrease-opacity",
            "geometry"
        ];


        opacity = {
            curve = "cubic-bezier(0.2, 0.8, 0.2, 1)";

            duration = 0.06;

            start = 0.86;
            end = 0.96;
        };


        blur-opacity = {
            curve = "cubic-bezier(0.2, 0.8, 0.2, 1)";

            duration = 0.06;

            start = 0.68;
            end = 0.84;
        };


        shadow-opacity = {
            curve = "cubic-bezier(0.2, 0.8, 0.2, 1)";

            duration = 0.06;

            start = 0.35;
            end = 0.44;
        };
    },


    ###########################################################
    #                     FOCUS OUT                          #
    ###########################################################

    {
        triggers = [ "decrease-opacity" ];

        suppressions = [
            "increase-opacity",
            "geometry"
        ];


        opacity = {
            curve = "cubic-bezier(0.4, 0, 1, 1)";

            duration = 0.06;

            start = 0.96;
            end = 0.86;
        };


        blur-opacity = {
            curve = "cubic-bezier(0.4, 0, 1, 1)";

            duration = 0.06;

            start = 0.84;
            end = 0.68;
        };


        shadow-opacity = {
            curve = "cubic-bezier(0.4, 0, 1, 1)";

            duration = 0.06;

            start = 0.44;
            end = 0.35;
        };
    },


    ###########################################################
    #            BSPWM MOVE / RESIZE / TILE CHANGE          #
    #
    # EXPERIMENTAL.
    #
    # Unlike geometry-change preset:
    #
    # saved-image-blend = 0
    #
    # means we do NOT stretch an old screenshot of the window.
    #
    ###########################################################

    {
        triggers = [ "geometry" ];

        suppressions = [
            "open",
            "show",
            "close",
            "hide"
        ];


        #######################################################
        # Horizontal scale
        #######################################################

        scale-x = {
            curve = "cubic-bezier(0.07, 0.65, 0, 1)";

            duration = 0.14;

            start = "window-width-before / window-width";
            end = 1.0;
        };


        #######################################################
        # Vertical scale
        #######################################################

        scale-y = {
            curve = "cubic-bezier(0.07, 0.65, 0, 1)";

            duration = 0.14;

            start = "window-height-before / window-height";
            end = 1.0;
        };


        #######################################################
        # X movement
        #######################################################

        offset-x = {
            curve = "cubic-bezier(0.07, 0.65, 0, 1)";

            duration = 0.14;

            start = "window-x-before - window-x";
            end = 0;
        };


        #######################################################
        # Y movement
        #######################################################

        offset-y = {
            curve = "cubic-bezier(0.07, 0.65, 0, 1)";

            duration = 0.14;

            start = "window-y-before - window-y";
            end = 0;
        };


        #######################################################
        # Match shadow to window
        #######################################################

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";

        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";


        #######################################################
        # EXPERIMENT:
        #
        # Disable old-image interpolation.
        # This can reduce geometry artefacts.
        #
        #######################################################

        saved-image-blend = 0;
    },


    ###########################################################
    #                       SIZE ONLY                        #
    #
    # Kept as an experiment.
    #
    # Uncomment instead of geometry above if you want to
    # separate resize effects from movement.
    #
    ###########################################################

    /*
    {
        triggers = [ "size" ];

        scale-x = {
            curve = "cubic-bezier(0.07, 0.65, 0, 1)";
            duration = 0.14;
            start = "window-width-before / window-width";
            end = 1;
        };

        scale-y = {
            curve = "cubic-bezier(0.07, 0.65, 0, 1)";
            duration = 0.14;
            start = "window-height-before / window-height";
            end = 1;
        };

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";

        saved-image-blend = 0;
    },
    */


    ###########################################################
    #                       POSITION                         #
    #
    # Separate position laboratory.
    #
    ###########################################################

    /*
    {
        triggers = [ "position" ];

        offset-x = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.12;
            start = "window-x-before - window-x";
            end = 0;
        };

        offset-y = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.12;
            start = "window-y-before - window-y";
            end = 0;
        };

        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    */


);


###############################################################
#                 OPTIONAL EXTREME EXPERIMENTS                #
###############################################################

#
# 1. MORE MOTION
#
# Replace the OPEN animation with:
#
#     preset = "fly-in";
#     direction = "down";
#     duration = 0.16;
#
# And close with:
#
#     preset = "fly-out";
#     direction = "down";
#     duration = 0.12;
#
# Picom supports:
#     up
#     down
#     left
#     right
#
# NOTE:
# fly animations can cross monitor boundaries on some
# multi-monitor setups. This behaviour has been reported
# upstream. 
#


#
# 2. SCALE POP
#
# Try:
#
#     start = 0.92;
#     end = 1.0;
#
# instead of 0.965.
#
# This gives a stronger "pop".
#


#
# 3. ULTRA SNAPPY
#
# Open:
#     duration = 0.08;
#
# Close:
#     duration = 0.06;
#
# Geometry:
#     duration = 0.10;
#
# This feels extremely fast.
#


#
# 4. CINEMATIC
#
# Open:
#     duration = 0.24;
#
# Close:
#     duration = 0.18;
#
# Geometry:
#     duration = 0.22;
#
# Much smoother, but less instant.
#


#
# 5. HEAVY BLUR
#
# strength = 8;
#
# Beautiful but expensive.
#


#
# 6. LIGHT BLUR
#
# strength = 4;
#
# Better on weaker hardware.
#
