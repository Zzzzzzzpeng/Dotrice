# ============================================================
# 🐈‍⬛ KITTY — ADULT CAT / MODERN / SMOOTH / GPU / RICH
# Target: kitty 0.49.1+ (September 2026)
# ============================================================

# ============================================================
# 🎨 THEME — LOAD FIRST, OVERRIDES BELOW WIN
# ============================================================

include theme.conf

# ============================================================
# 🔤 FONT
# ============================================================

font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font auto

font_size         14.0

disable_ligatures never
underline_exclusion 1
text_composition_strategy platform

adjust_line_height 105%
adjust_column_width 0

# ============================================================
# 🪟 WINDOW / COMPOSITING
# ============================================================

hide_window_decorations yes
confirm_os_window_close 0

remember_window_size     yes
remember_window_position yes

initial_window_width  130c
initial_window_height 38c

placement_strategy center
padding_fill_strategy neighboring_cell

window_padding_width        40
single_window_padding_width 40

window_margin_width        0
single_window_margin_width 0

window_border_width 0.5pt
window_border_radius 12

draw_minimal_borders              yes
draw_window_borders_for_single_window no

active_border_color   #8ccf7e
inactive_border_color #3b414d

inactive_text_alpha 0.88

# ============================================================
# 🌫️ TRANSPARENCY / BLUR
# ============================================================

background_opacity         0.86
dynamic_background_opacity yes
background_blur            20

# Keep editor backgrounds visually integrated with Kitty.
transparent_background_colors #000000@0.86 #111318@0.84

# ============================================================
# ⚡ GPU / PERFORMANCE / LATENCY
# ============================================================

sync_to_monitor yes

repaint_delay 2
input_delay   0

auto_reload_config 0.1

resize_debounce_time 0.05

# ============================================================
# 🧪 MODERN VISUAL SHADERS — KITTY 0.49+
# ============================================================

# Built-in shaders shipped by Kitty.
# Cursor trail becomes a live visual effect.
custom_shaders cursor-trail-blaze focus-highlight tab-change

# ============================================================
# ✨ CURSOR
# ============================================================

cursor #8ccf7e
cursor_text_color background

cursor_shape           beam
cursor_shape_unfocused hollow
cursor_beam_thickness  1.8

cursor_blink_interval       0.65 ease-in-out
cursor_stop_blinking_after  12

cursor_trail               2
cursor_trail_decay         0.03 0.12
cursor_trail_start_threshold 1
cursor_trail_color         #8ccf7e

# ============================================================
# 🖱️ MOUSE
# ============================================================

mouse_hide_wait 2.0

click_interval -1.0
focus_follows_mouse no

default_pointer_shape beam
pointer_shape_when_grabbed arrow
pointer_shape_when_dragging beam crosshair

drag_threshold 4
window_drag_tolerance 2

# ============================================================
# 📜 SCROLLBACK — SMOOTH / KINETIC
# ============================================================

scrollback_lines 20000
scrollback_pager_history_size 8192

pixel_scroll yes
momentum_scroll 0.96

wheel_scroll_multiplier 3.0
wheel_scroll_min_lines 1
touch_scroll_multiplier 1.0

# ============================================================
# 📏 SCROLLBAR
# ============================================================


scrollbar_interactive   yes
scrollbar_jump_on_click yes

scrollbar_width      0.8
scrollbar_hover_width 1.2

scrollbar_radius 0.35
scrollbar_gap 0.15

scrollbar_min_handle_height 1
scrollbar_hitbox_expansion 0.35

scrollbar_handle_opacity 0.72
scrollbar_track_opacity  0.00
scrollbar_track_hover_opacity 0.12

scrollbar_handle_color #8ccf7e
scrollbar_track_color  #3b414d

progress_bar top

# ============================================================
# 🐚 SHELL INTEGRATION
# ============================================================

shell .
shell_integration enabled

allow_hyperlinks yes
open_url_with default
detect_urls yes

notify_on_cmd_finish invisible 8.0

# ============================================================
# 📦 CLIPBOARD / TEXT
# ============================================================

copy_on_select yes
strip_trailing_spaces smart
clear_selection_on_clipboard_loss yes

clipboard_control \
  write-clipboard \
  write-primary \
  read-clipboard-ask \
  read-primary-ask

# ============================================================
# 🔔 BELL / NOTIFICATIONS
# ============================================================

enable_audio_bell yes

visual_bell_duration 0.25 ease-in-out

window_alert_on_bell yes
bell_on_tab "🔔 "

# ============================================================
# 🗂️ TABS
# ============================================================

tab_bar_edge top

tab_bar_style fade
tab_powerline_style round

tab_bar_align left

tab_bar_min_tabs 1
tab_bar_show_new_tab_button yes

tab_switch_strategy previous

tab_activity_symbol "● "
tab_title_max_length 40

tab_title_template "{index}: {title} {activity_symbol}{bell_symbol}"

active_tab_foreground   #111318
active_tab_background   #8ccf7e
active_tab_font_style   bold

inactive_tab_foreground #9aa4b2
inactive_tab_background #20242d
inactive_tab_font_style normal

tab_bar_background #141B1E

# ============================================================
# 🧩 LAYOUTS
# ============================================================

enabled_layouts splits,tall,grid,fat,stack

window_resize_step_cells 2
window_resize_step_lines 2

# ============================================================
# ⌨️ KEYBOARD
# ============================================================

kitty_mod ctrl+shift

# ------------------------------------------------------------
# 🪟 Windows / Tabs
# ------------------------------------------------------------

map kitty_mod+enter new_window
map kitty_mod+t new_tab

map kitty_mod+w close_window
map kitty_mod+q close_tab

map kitty_mod+right next_tab
map kitty_mod+left  previous_tab

map kitty_mod+. move_tab_forward
map kitty_mod+, move_tab_backward

# ------------------------------------------------------------
# 🧭 Window Navigation
# ------------------------------------------------------------

map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window bottom
map kitty_mod+k neighboring_window top
map kitty_mod+l neighboring_window right

map kitty_mod+shift+h move_window left
map kitty_mod+shift+j move_window bottom
map kitty_mod+shift+k move_window top
map kitty_mod+shift+l move_window right

map kitty_mod+equal resize_window wider 3
map kitty_mod+minus resize_window narrower 3

map kitty_mod+shift+equal resize_window taller 2
map kitty_mod+shift+minus resize_window shorter 2

# ------------------------------------------------------------
# 🧱 Layout Control
# ------------------------------------------------------------

map kitty_mod+u next_layout
map kitty_mod+shift+u last_used_layout

map kitty_mod+f5 layout_action rotate
map kitty_mod+f6 layout_action mirror

# ------------------------------------------------------------
# 🔎 Scrollback / Search
# ------------------------------------------------------------

map kitty_mod+h show_scrollback
map kitty_mod+g show_last_command_output
map kitty_mod+slash search_scrollback

map kitty_mod+up   scroll_line_up smooth
map kitty_mod+down scroll_line_down smooth

map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down

map kitty_mod+shift+up   scroll_to_prompt -1
map kitty_mod+shift+down scroll_to_prompt 1

# ------------------------------------------------------------
# 🔗 Hints / URLs / Files
# ------------------------------------------------------------

map kitty_mod+e open_url_with_hints

map kitty_mod+p>f kitten hints --type path --program -
map kitty_mod+p>l kitten hints --type line --program -
map kitty_mod+p>w kitten hints --type word --program -
map kitty_mod+p>n kitten hints --type linenum
map kitty_mod+p>y kitten hints --type hyperlink

map kitty_mod+p>c kitten choose-files
map kitty_mod+p>d kitten choose-files --mode=dir

# ------------------------------------------------------------
# 🧰 Kitty UI
# ------------------------------------------------------------

map kitty_mod+f1 show_kitty_doc overview
map kitty_mod+f2 edit_config_file
map kitty_mod+f3 command_palette

map kitty_mod+f5 load_config_file
map kitty_mod+f6 debug_config

map kitty_mod+escape kitty_shell window

# ------------------------------------------------------------
# 🌫️ Transparency
# ------------------------------------------------------------

map kitty_mod+a>m set_background_opacity +0.05
map kitty_mod+a>l set_background_opacity -0.05
map kitty_mod+a>1 set_background_opacity 1
map kitty_mod+a>d set_background_opacity default

# ------------------------------------------------------------
# 🔠 Font
# ------------------------------------------------------------

map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+backspace change_font_size all 0

# ------------------------------------------------------------
# 🧹 Terminal
# ------------------------------------------------------------

map kitty_mod+delete clear_terminal reset active

# ------------------------------------------------------------
# 🖥️ OS Window
# ------------------------------------------------------------

map kitty_mod+f10 toggle_maximized
map kitty_mod+f11 toggle_fullscreen

# ------------------------------------------------------------
# 🆎 Unicode
# ------------------------------------------------------------

map kitty_mod+u kitten unicode_input

# ============================================================
# 🖱️ MOUSE MAPPINGS
# ============================================================

mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link
mouse_map middle release ungrabbed paste_from_selection

# ============================================================
# 🧠 COMMAND / SHELL POWER
# ============================================================

editor .
update_check_interval 24

# Keep application control off unless explicitly needed.
allow_remote_control no

# ============================================================
# 🐈‍⬛ END — ADULT CAT MODE
# ============================================================
